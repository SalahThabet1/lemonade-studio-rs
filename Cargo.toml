[package]
name = "lemonade-studio-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.9.1"
gpui-component = "0.9.1"
gpui-kit-assets = "0.9.1"
gpui-base = "0.9.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
base64 = "0.22"
chrono = "0.4"
open = "5.3"
anyhow = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time"] }
rfd = "0.18.0"
